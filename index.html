  /* ============================================================
     EDIT YOUR FAMILY DATA in the <script> block near the bottom

     ============================================================ */

  :root{
    --indigo-deep:   #17213B;
    --indigo-mid:    #223058;
    --sand:          #E9DFC7;
    --sand-light:    #F3ECDB;
    --gold:          #C9992F;
    --clay:          #A24A32;
    --ink:           #1B2A4A;
    --paper:         #F5F0E4;
    --line:          rgba(233, 223, 199, 0.18);
    --shadow:        0 18px 40px rgba(10, 15, 30, 0.35);
    --serif: 'Fraunces', Georgia, serif;
    --sans: 'Karla', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0; padding:0;
    background: var(--indigo-deep);
    color: var(--paper);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  .kb-root{
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 24px 96px;
    position: relative;
  }

  /* -------- River motif backdrop -------- */
  .kb-river{
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 620px;
    z-index: 0;
    pointer-events: none;
    opacity: 0.55;
  }

  /* -------- Hero -------- */
  .kb-hero{
    position: relative;
    z-index: 1;
    padding: 88px 0 56px;
    text-align: left;
  }
  .kb-eyebrow{
    font-family: var(--sans);
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--gold);
    margin: 0 0 18px;
  }
  .kb-hero h1{
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(38px, 6vw, 64px);
    line-height: 1.05;
    margin: 0 0 20px;
    max-width: 14ch;
  }
  .kb-hero p{
    font-size: 18px;
    line-height: 1.6;
    color: var(--sand);
    max-width: 52ch;
    margin: 0;
  }

  /* -------- Section headings -------- */
  .kb-section-head{
    display:flex;
    align-items: baseline;
    gap: 16px;
    margin: 0 0 40px;
    position: relative;
    z-index: 1;
  }
  .kb-section-head .kb-gen-mark{
    font-family: var(--serif);
    font-size: 15px;
    color: var(--indigo-deep);
    background: var(--gold);
    padding: 4px 12px;
    border-radius: 3px;
    font-weight: 600;
    white-space: nowrap;
  }
  .kb-section-head h2{
    font-family: var(--serif);
    font-weight: 500;
    font-size: 22px;
    color: var(--sand-light);
    margin: 0;
  }
  .kb-section-head .kb-rule{
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  /* -------- Tree -------- */
  .kb-tree{
    position: relative;
    z-index: 1;
    padding-top: 8px;
  }
  .kb-gen-row{
    position: relative;
    display: flex;
    flex-wrap: wrap;
    gap: 28px;
    justify-content: center;
    margin-bottom: 86px;
  }
  .kb-connector-svg{
    position: absolute;
    top: -86px;
    left: 0;
    width: 100%;
    height: 86px;
    overflow: visible;
    pointer-events: none;
  }
  .kb-connector-svg path{
    fill: none;
    stroke: var(--gold);
    stroke-width: 1.5;
    stroke-opacity: 0.55;
  }

  .kb-card{
    background: var(--indigo-mid);
    border: 1px solid rgba(201, 153, 47, 0.28);
    border-radius: 4px;
    width: 190px;
    padding: 20px 18px 18px;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.2s ease, transform 0.2s ease, background 0.2s ease;
    position: relative;
  }
  .kb-card:hover, .kb-card:focus-visible{
    border-color: var(--gold);
    transform: translateY(-3px);
    background: #283864;
    outline: none;
  }
  .kb-card.is-selected{
    border-color: var(--gold);
    background: #2E3F70;
  }
  .kb-card.is-selected::after{
    content: "";
    position: absolute;
    bottom: -9px;
    left: 20px;
    width: 12px;
    height: 12px;
    background: #2E3F70;
    border-right: 1px solid var(--gold);
    border-bottom: 1px solid var(--gold);
    transform: rotate(45deg);
  }
  .kb-avatar{
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--gold);
    color: var(--indigo-deep);
    font-family: var(--serif);
    font-weight: 600;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 14px;
  }
  .kb-card h3{
    font-family: var(--serif);
    font-weight: 600;
    font-size: 17px;
    margin: 0 0 4px;
    color: var(--paper);
    line-height: 1.25;
  }
  .kb-card .kb-years{
    font-size: 13px;
    color: var(--sand);
    opacity: 0.75;
    margin: 0;
  }

  /* -------- Story panel -------- */
  .kb-panel{
    position: relative;
    z-index: 1;
    background: var(--sand-light);
    color: var(--ink);
    border-radius: 6px;
    padding: 36px 40px;
    margin: 4px 0 80px;
    box-shadow: var(--shadow);
    display: none;
  }
  .kb-panel.is-open{ display: block; }
  .kb-panel-top{
    display: flex;
    gap: 22px;
    align-items: center;
    margin-bottom: 22px;
  }
  .kb-panel-avatar{
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--indigo-deep);
    color: var(--gold);
    font-family: var(--serif);
    font-weight: 600;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .kb-panel h3{
    font-family: var(--serif);
    font-weight: 600;
    font-size: 26px;
    margin: 0 0 4px;
  }
  .kb-panel .kb-years{
    font-size: 14px;
    color: var(--clay);
    margin: 0;
    font-weight: 600;
  }
  .kb-panel p.kb-story{
    font-size: 16px;
    line-height: 1.7;
    margin: 0;
    max-width: 68ch;
  }
  .kb-panel-close{
    float: right;
    background: none;
    border: none;
    font-family: var(--sans);
    font-size: 14px;
    color: var(--ink);
    opacity: 0.55;
    cursor: pointer;
    padding: 4px 8px;
  }
  .kb-panel-close:hover{ opacity: 1; }

  .kb-panel-children{
    margin-top: 22px;
  }
  .kb-panel-children h4{
    font-family: var(--sans);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--clay);
    font-weight: 700;
    margin: 18px 0 10px;
  }
  .kb-panel-children h4:first-child{
    margin-top: 0;
  }
  .kb-child-list{
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .kb-child-chip{
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    background: #fff;
    border: 1px solid rgba(27, 42, 74, 0.2);
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .kb-child-chip:hover{
    background: var(--gold);
    border-color: var(--gold);
    color: var(--indigo-deep);
  }

  @media (max-width: 640px){
    .kb-card{ width: 44%; min-width: 145px; }
    .kb-panel{ padding: 26px 22px; }
    .kb-panel-top{ align-items: flex-start; }
  }

/* ============================================================
   Rendering logic below — you shouldn't need to edit this.
   ============================================================ */

function initials(name){
  return name.split(" ").filter(Boolean).map(w => w[0]).slice(0,2).join("").toUpperCase();
}

function buildGenerations(data){
  const byParent = {};
  data.forEach(p => {
    const key = p.parentId || "__root__";
    if(!byParent[key]) byParent[key] = [];
    byParent[key].push(p);
  });

  const generations = [];
  let current = byParent["__root__"] || [];
  while(current.length){
    generations.push(current);
    let next = [];
    current.forEach(p => {
      if(byParent[p.id]) next = next.concat(byParent[p.id]);
    });
    current = next;
  }
  return generations;
}

const treeEl = document.getElementById("kbTree");
const generations = buildGenerations(familyData);
const genLabels = ["First Generation", "Second Generation", "Third Generation", "Fourth Generation", "Fifth Generation", "Sixth Generation"];

generations.forEach((gen, gi) => {
  const head = document.createElement("div");
  head.className = "kb-section-head";
  head.innerHTML = `<span class="kb-gen-mark">${gi+1}</span><h2>${genLabels[gi] || "Generation " + (gi+1)}</h2><span class="kb-rule"></span>`;
  treeEl.appendChild(head);

  const row = document.createElement("div");
  row.className = "kb-gen-row";
  row.dataset.gen = gi;

  if(gi > 0){
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("class", "kb-connector-svg");
    svg.dataset.gen = gi;
    row.appendChild(svg);
  }

  gen.forEach(person => {
    const card = document.createElement("button");
    card.className = "kb-card";
    card.dataset.id = person.id;
    card.innerHTML = `<div class="kb-avatar">${initials(person.name)}</div>
                       <h3>${person.name}</h3>
                       <p class="kb-years">${person.years || ""}</p>`;
    card.addEventListener("click", () => showPanel(person, card));
    row.appendChild(card);
  });

  treeEl.appendChild(row);
});

function drawConnectors(){
  generations.forEach((gen, gi) => {
    if(gi === 0) return;
    const row = treeEl.querySelectorAll(".kb-gen-row")[gi];
    const svg = row.querySelector(".kb-connector-svg");
    if(!svg) return;
    svg.innerHTML = "";
    const rowRect = row.getBoundingClientRect();

    gen.forEach(person => {
      const childCard = row.querySelector(`[data-id="${person.id}"]`);
      const parentCard = treeEl.querySelector(`[data-id="${person.parentId}"]`);
      if(!childCard || !parentCard) return;

      const c = childCard.getBoundingClientRect();
      const p = parentCard.getBoundingClientRect();

      const x1 = p.left + p.width/2 - rowRect.left;
      const y1 = 0;
      const x2 = c.left + c.width/2 - rowRect.left;
      const y2 = 86;
      const midY = 43;

      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", `M ${x1} ${y1} C ${x1} ${midY}, ${x2} ${midY}, ${x2} ${y2}`);
      svg.appendChild(path);
    });
  });
}

let selectedCard = null;
const panel = document.getElementById("kbPanel");

function findPersonById(id){
  return familyData.find(p => p.id === id);
}

function showPanel(person, card){
  document.getElementById("kbPanelAvatar").textContent = initials(person.name);
  document.getElementById("kbPanelName").textContent = person.name;
  document.getElementById("kbPanelYears").textContent = person.years || "";
  document.getElementById("kbPanelStory").textContent = person.story || "";

  const childrenOfPerson = familyData.filter(p => p.parentId === person.id);
  const childrenBox = document.getElementById("kbPanelChildren");

  function chipsHtml(list){
    return list.map(c =>
      `<button class="kb-child-chip" data-jump-id="${c.id}">${c.name}</button>`
    ).join("");
  }

  function wireChips(container){
    container.querySelectorAll(".kb-child-chip").forEach(btn => {
      btn.addEventListener("click", () => {
        const childId = btn.dataset.jumpId;
        const childPerson = findPersonById(childId);
        const childCard = treeEl.querySelector(`[data-id="${childId}"]`);
        if(childPerson && childCard) showPanel(childPerson, childCard);
      });
    });
  }

  if(childrenOfPerson.length){
    const hasSpouseGroups = childrenOfPerson.some(c => c.viaSpouse);
    if(hasSpouseGroups){
      const groups = {};
      const noSpouseGroup = [];
      childrenOfPerson.forEach(c => {
        if(c.viaSpouse){
          if(!groups[c.viaSpouse]) groups[c.viaSpouse] = [];
          groups[c.viaSpouse].push(c);
        } else {
          noSpouseGroup.push(c);
        }
      });
      let html = "";
      Object.keys(groups).forEach(spouseName => {
        html += `<h4>With ${spouseName}</h4><div class="kb-child-list">${chipsHtml(groups[spouseName])}</div>`;
      });
      if(noSpouseGroup.length){
        html += `<h4>Other children</h4><div class="kb-child-list">${chipsHtml(noSpouseGroup)}</div>`;
      }
      childrenBox.innerHTML = html;
    } else {
      childrenBox.innerHTML = `<h4>Children</h4><div class="kb-child-list">${chipsHtml(childrenOfPerson)}</div>`;
    }
    wireChips(childrenBox);
  } else {
    childrenBox.innerHTML = "";
  }

  if(selectedCard) selectedCard.classList.remove("is-selected");
  card.classList.add("is-selected");
  selectedCard = card;

  panel.classList.add("is-open");
  panel.scrollIntoView({ behavior: "smooth", block: "center" });
}

document.getElementById("kbPanelClose").addEventListener("click", () => {
  panel.classList.remove("is-open");
  if(selectedCard) selectedCard.classList.remove("is-selected");
  selectedCard = null;
});

window.addEventListener("load", drawConnectors);
window.addEventListener("resize", drawConnectors);
// draw once immediately too, in case fonts/layout are already settled
drawConnectors();
